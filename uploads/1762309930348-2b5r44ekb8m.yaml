apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-master
  namespace: lamp
  labels:
    app: redis
    role: master
spec:
  replicas: 1  # 主节点单实例
  selector:
    matchLabels:
      app: redis
      role: master
  template:
    metadata:
      labels:
        app: redis
        role: master
    spec:
      containers:
      - name: redis
        image: redis:6.2-alpine
        command: ["redis-server"]
        args:
        - "--appendonly"  # 启用持久化
        - "yes"
        - "--save"        # 持久化策略
        - "900 1"
        - "--requirepass"  # 主节点密码
        - "Lhj230200601"
        ports:
        - containerPort: 6379
        volumeMounts:
        - name: redis-data
          mountPath: /data
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-pvc-master
---
apiVersion: v1
kind: Service
metadata:
  name: redis-master
  namespace: lamp
spec:
  selector:
    app: redis
    role: master
  ports:
  - protocol: TCP
    port: 6379
    targetPort: 6379
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc-master
  namespace: lamp
spec:
  storageClassName: local-storage
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
