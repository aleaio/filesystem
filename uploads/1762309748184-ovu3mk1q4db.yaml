apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: lamp
spec:
  serviceName: mysql
  replicas: 2
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      initContainers:
      - name: init-mysql
        image: busybox
        command:
        - sh
        - "-c"
        - |
          echo "Initializing MySQL configuration..."
          ORDINAL=${HOSTNAME##*-}
          echo "Pod ordinal: $ORDINAL"
          
          if [ "$ORDINAL" = "0" ]; then
            echo "Using master configuration"
            cp /mnt/config/master.cnf /etc/mysql/conf.d/
          else
            echo "Using slave configuration"
            cp /mnt/config/slave.cnf /etc/mysql/conf.d/
          fi
        volumeMounts:
        - name: config
          mountPath: /mnt/config
        - name: conf-d
          mountPath: /etc/mysql/conf.d
      
      containers:
      - name: mysql
        image: mysql:5.7
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: root-password
        - name: MYSQL_DATABASE
          value: wordpress
        - name: MYSQL_USER
          value: wp_user
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: root-password
        ports:
        - containerPort: 3306
          name: mysql
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
        - name: conf-d
          mountPath: /etc/mysql/conf.d
        livenessProbe:
          exec:
            command:
            - bash
            - -c
            - |
              mysqladmin -uroot -p"$MYSQL_ROOT_PASSWORD" ping 2>/dev/null
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command:
            - bash
            - -c
            - |
              mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -e 'SELECT 1' 2>/dev/null
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: config
        configMap:
          name: mysql-config
      - name: conf-d
        emptyDir: {}
  
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: local-storage
      resources:
        requests:
          storage: 5Gi
