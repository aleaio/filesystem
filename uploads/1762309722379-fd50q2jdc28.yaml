apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-slave
  namespace: lamp
  labels:
    app: redis
    role: slave
spec:
  replicas: 2
  selector:
    matchLabels:
      app: redis
      role: slave
  template:
    metadata:
      labels:
        app: redis
        role: slave
    spec:
      containers:
      - name: redis
        image: redis:6.2-alpine
        command: ["redis-server"]
        args:
        - "--slaveof"
        - "redis-master"
        - "6379"
        - "--requirepass"
        - "Lhj230200601"
        - "--masterauth"
        - "Lhj230200601"
        ports:
        - containerPort: 6379
        volumeMounts:
        - name: redis-data
          mountPath: /data
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-pvc-slave
---
apiVersion: v1
kind: Service
metadata:
  name: redis-slave
  namespace: lamp
spec:
  selector:
    app: redis
    role: slave
  ports:
  - protocol: TCP
    port: 6379
    targetPort: 6379
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc-slave
  namespace: lamp
spec:
  storageClassName: local-storage
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
